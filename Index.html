<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Інтерактивна презентація</title>

  <!-- Локальні стилі та скрипти Swiper -->
  <link rel="stylesheet" href="css/swiper-bundle.min.css" />
  <script src="js/swiper-bundle.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }

    .swiper {
      width: 100%;
      height: 100%;
    }

    .swiper-slide {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      position: relative;
    }

    /* Звичайні картинки */
    .slide-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Навігація */
    .swiper-button-next, .swiper-button-prev {
      color: #ffffff;
      background: rgba(0, 0, 0, 0.4);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      backdrop-filter: blur(4px);
    }

    .swiper-button-next:after, .swiper-button-prev:after {
      font-size: 24px;
      font-weight: bold;
    }

    .swiper-pagination-bullet {
      background: #ffffff;
      opacity: 0.5;
    }
    .swiper-pagination-bullet-active {
      opacity: 1;
      background: #0096ff;
    }

    /* Інтерактивний контейнер */
    .interactive-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .interactive-svg {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
    }

    /* Фігури зі звуком */
    .clickable-shape {
      fill: rgba(0, 150, 255, 0.1);
      stroke: #0096ff;
      opacity: 0.2;
      stroke-width: 3;
      cursor: pointer;
      transition: fill 0.2s ease, stroke 0.2s ease, filter 0.2s ease;
    }

    .clickable-shape:active, .clickable-shape.active {
      fill: rgba(255, 215, 0, 0.9) !important;
      stroke: #ffd700 !important;
      stroke-width: 5;
      filter: drop-shadow(0px 0px 15px #ffd700);
    }

    /* Кнопки-зони тестів */
    .btn-zone {
      fill: rgba(255, 255, 255, 0.01);
      stroke: transparent;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-zone:active {
      fill: rgba(255, 255, 255, 0.25);
    }

    /* Попап модального вікна */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .popup-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .popup-card {
      width: 90%;
      max-width: 500px;
      background: #222;
      color: #fff;
      padding: 40px 30px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      border: 4px solid transparent;
    }

    .popup-icon {
      font-size: 64px;
      margin-bottom: 15px;
    }

    #popup-title {
      font-size: 32px;
      margin: 0 0 10px 0;
    }

    #popup-text {
      font-size: 20px;
      color: #ddd;
      margin-bottom: 25px;
    }

    .popup-close-btn {
      background: #fff;
      color: #000;
      border: none;
      padding: 15px 40px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
    }

    /* Анімації */
    .popup-card.wrong {
      border-color: #ff3355;
      animation: popupShake 0.4s ease-in-out;
    }
    .popup-card.wrong #popup-title { color: #ff3355; }

    @keyframes popupShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-20px); }
      40% { transform: translateX(20px); }
      60% { transform: translateX(-10px); }
      80% { transform: translateX(10px); }
    }

    .popup-card.correct {
      border-color: #00ff88;
      animation: popupPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .popup-card.correct #popup-title { color: #00ff88; }

    @keyframes popupPop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Прозорі зони за замовчуванням */
    .clean-choice-btn {
      fill: rgba(255, 255, 255, 0.01);
      stroke: transparent;
      stroke-width: 6;
      cursor: pointer;
      transition: fill 0.3s ease, stroke 0.3s ease;
    }

    .clean-choice-btn.is-found {
      fill: rgba(0, 255, 136, 0.25) !important;
      stroke: #00ff88 !important;
      pointer-events: none;
    }

    .clean-choice-btn.is-wrong {
      animation: wrongFlash 0.5s ease-in-out;
    }

    @keyframes wrongFlash {
      0%, 100% { fill: rgba(255, 255, 255, 0.01); stroke: transparent; }
      50% { fill: rgba(255, 51, 85, 0.4); stroke: #ff3355; }
    }

    .clean-choice-btn.all-complete {
      animation: successPulse 1s infinite alternate ease-in-out;
    }

    @keyframes successPulse {
      0% { fill: rgba(0, 255, 136, 0.3); stroke: #00ff88; filter: drop-shadow(0 0 5px #00ff88); }
      100% { fill: rgba(255, 215, 0, 0.5); stroke: #ffd700; filter: drop-shadow(0 0 20px #ffd700); }
    }

    /* Контейнер для слайда з малюванням */
    .drawing-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .drawing-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      touch-action: none;
      cursor: crosshair;
    }

    .drawing-tools {
      position: absolute;
      bottom: 25px;
      right: 25px;
      z-index: 10;
      display: flex;
      gap: 12px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 15px;
      border-radius: 30px;
      backdrop-filter: blur(5px);
    }

    .color-picker {
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
    }

    .clear-btn {
      background: #ff3355;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .clear-btn:active {
      transform: scale(0.95);
    }

    /* Контейнер слайда */
    .dnd-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dnd-board {
      position: relative;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      max-width: 100%;
      max-height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dnd-bg {
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
    }

    .drop-zone {
      position: absolute;
      border-radius: 20px;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    .drop-zone.correct-placed {
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.8);
      border: 3px solid #00ff88;
    }

    .drag-item {
      position: absolute;
      cursor: grab;
      touch-action: none;
      box-sizing: border-box;
      z-index: 20;
      object-fit: contain;
      user-select: none;
    }

    .drag-item.placed {
      opacity: 1;
      pointer-events: none;
    }

    .success-popup {
      position: absolute;
      bottom: 2%;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      width: 90%;
      height: 25%;
      background: rgba(255, 255, 255, 0.95);
      border: 4px solid #00ff88;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .success-popup.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .success-popup span {
      font-size: 28px;
      font-weight: bold;
      color: #1a1a1a;
    }

    .reset-btn {
      background: #0096ff;
      color: white;
      border: none;
      padding: 10px 25px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .reset-btn:hover {
      background: #0077cc;
      transform: scale(1.05);
    }

    .reset-btn:active {
      transform: scale(0.95);
    }

    #slide-10 {
  position: relative;
}

#slide-10 .interactive-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* Базовий стан прихованих елементів */
.step-img {
  position: absolute;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, transform 0.3s ease;
  transform: scale(0.95);
  pointer-events: auto;
}

/* Стан після кліку */
.step-img.visible {
  opacity: 1;
  visibility: visible;
  transform: scale(1);
}
  </style>

  <div id="popup-modal" class="popup-overlay">
    <div class="popup-card" id="popup-card">
      <div class="popup-icon" id="popup-icon"></div>
      <h2 id="popup-title"></h2>
      <p id="popup-text"></p>
      <button class="popup-close-btn" id="popup-close">Зрозуміло</button>
    </div>

  <script>
    const swiper = new Swiper('.swiper', {
      navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
      pagination: { el: '.swiper-pagination', clickable: true },
      keyboard: { enabled: true, onlyInViewport: true },
      touchEventsTarget: 'wrapper',
      threshold: 10,
    });

    document.querySelectorAll('.clickable-shape').forEach(shape => {
      shape.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        const soundId = shape.getAttribute('data-sound');
        const audio = document.getElementById(soundId);

        if (audio) {
          audio.currentTime = 0;
          audio.play().catch(err => console.log("Помилка аудіо:", err));
          setTimeout(() => audio.pause(), 2500);
        }

        shape.classList.add('active');
        setTimeout(() => shape.classList.remove('active'), 2500);
      });
    });

    document.addEventListener('DOMContentLoaded', () => {
      const popupModal = document.getElementById('popup-modal');
      const popupCard = document.getElementById('popup-card');
      const popupIcon = document.getElementById('popup-icon');
      const popupTitle = document.getElementById('popup-title');
      const popupText = document.getElementById('popup-text');
      const popupClose = document.getElementById('popup-close');

      function showPopup(type, title, text) {
        if (!popupModal) return;
        const icon = (type === 'correct') ? '🎉' : '❌';
        
        popupCard.className = 'popup-card ' + type;
        popupIcon.textContent = icon;
        popupTitle.textContent = title || (type === 'correct' ? 'Правильно!' : 'Помилка!');
        popupText.textContent = text || '';
        
        popupModal.classList.add('active');
      }

      if (popupClose) {
        popupClose.addEventListener('click', () => {
          popupModal.classList.remove('active');
        });
      }

      document.addEventListener('pointerdown', (e) => {
        const btn = e.target.closest('.btn-zone');
        if (btn) {
          e.stopPropagation();
          const type = btn.getAttribute('data-popup-type') || (btn.classList.contains('correct-btn') ? 'correct' : 'wrong');
          const title = btn.getAttribute('data-popup-title');
          const text = btn.getAttribute('data-popup-text');
          showPopup(type, title, text);
        }
      });
    });

    document.addEventListener('DOMContentLoaded', () => {
      document.addEventListener('pointerdown', (e) => {
        const btn = e.target.closest('.clean-choice-btn');
        if (!btn || btn.classList.contains('is-found')) return;

        e.stopPropagation();

        const isCorrect = btn.getAttribute('data-correct') === 'true';
        const slide = btn.closest('.swiper-slide');

        if (isCorrect) {
          btn.classList.add('is-found');

          const totalCorrect = slide.querySelectorAll('.clean-choice-btn[data-correct="true"]').length;
          const foundCorrect = slide.querySelectorAll('.clean-choice-btn.is-found').length;

          if (foundCorrect === totalCorrect) {
            slide.querySelectorAll('.clean-choice-btn.is-found').forEach(el => {
              el.classList.add('all-complete');
            });
          }
        } else {
          btn.classList.remove('is-wrong');
          void btn.offsetWidth;
          btn.classList.add('is-wrong');
        }
      });
    });

   document.addEventListener('DOMContentLoaded', () => {
  const drawingContainers = document.querySelectorAll('.drawing-container');

  drawingContainers.forEach(container => {
    const canvas = container.querySelector('.drawing-canvas');
    const colorPicker = container.querySelector('.color-picker');
    const clearBtn = container.querySelector('.clear-btn');
    if (!canvas) return;

    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(canvas, 0, 0);

      canvas.width = rect.width;
      canvas.height = rect.height;

      ctx.drawImage(tempCanvas, 0, 0, rect.width, rect.height);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 5;
    }

    if (typeof swiper !== 'undefined') {
      swiper.on('slideChangeTransitionEnd', resizeCanvas);
      swiper.on('resize', resizeCanvas);
    }

    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 200);

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDrawing(e) {
      isDrawing = true;
      if (typeof swiper !== 'undefined') swiper.allowTouchMove = false;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      const pos = getPos(e);
      ctx.strokeStyle = colorPicker ? colorPicker.value : '#ff3355';
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() {
      if (!isDrawing) return;
      isDrawing = false;
      ctx.closePath();
      if (typeof swiper !== 'undefined') swiper.allowTouchMove = true;
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', (e) => {
      e.stopPropagation();
      startDrawing(e);
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.stopPropagation();
      draw(e);
    }, { passive: false });

    window.addEventListener('touchend', stopDrawing);

    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      });
    }
  });
});

    document.addEventListener('DOMContentLoaded', () => {
      const items = document.querySelectorAll('.drag-item');
      const dropZones = document.querySelectorAll('.drop-zone');
      const popup = document.getElementById('success-popup');

      items.forEach(item => {
        let active = false;
        let shiftX = 0, shiftY = 0;

        item.setAttribute('data-start-left', item.style.left);
        item.setAttribute('data-start-top', item.style.top);
        item.setAttribute('data-start-width', item.style.width);
        item.setAttribute('data-start-height', item.style.height);

        item.addEventListener('pointerdown', (e) => {
          if (item.classList.contains('placed')) return;
          e.stopPropagation();

          active = true;
          const rect = item.getBoundingClientRect();

          shiftX = e.clientX - rect.left;
          shiftY = e.clientY - rect.top;

          item.style.zIndex = '1000';
          item.style.cursor = 'grabbing';

          function onPointerMove(moveEvent) {
            if (!active) return;
            
            const boardRect = item.closest('.dnd-board').getBoundingClientRect();
            const x = moveEvent.clientX - boardRect.left - shiftX;
            const y = moveEvent.clientY - boardRect.top - shiftY;

            item.style.left = `${(x / boardRect.width) * 100}%`;
            item.style.top = `${(y / boardRect.height) * 100}%`;
          }

          function onPointerUp(upEvent) {
            if (!active) return;
            active = false;

            document.removeEventListener('pointermove', onPointerMove);
            document.removeEventListener('pointerup', onPointerUp);

            item.style.zIndex = '20';
            item.style.cursor = 'grab';

            const itemRect = item.getBoundingClientRect();
            const itemId = item.getAttribute('data-id');
            let placed = false;

            dropZones.forEach(zone => {
              const zoneRect = zone.getBoundingClientRect();
              const targetId = zone.getAttribute('data-target');

              const centerX = itemRect.left + itemRect.width / 2;
              const centerY = itemRect.top + itemRect.height / 2;

              if (
                centerX >= zoneRect.left &&
                centerX <= zoneRect.right &&
                centerY >= zoneRect.top &&
                centerY <= zoneRect.bottom
              ) {
                if (itemId === targetId) {
                  placed = true;
                  zone.classList.add('correct-placed');
                  item.classList.add('placed');

                  item.style.left = zone.style.left;
                  item.style.top = zone.style.top;
                  item.style.width = zone.style.width;
                  item.style.height = zone.style.height;

                  checkWinCondition();
                }
              }
            });

            if (!placed) {
              item.style.left = item.getAttribute('data-start-left');
              item.style.top = item.getAttribute('data-start-top');
            }
          }

          document.addEventListener('pointermove', onPointerMove);
          document.addEventListener('pointerup', onPointerUp);
        });
      });

      function checkWinCondition() {
        const placedItems = document.querySelectorAll('.drag-item.placed');
        if (placedItems.length === 5) {
          setTimeout(() => {
            popup.classList.add('show');
          }, 300);
        }
      }

      window.resetGame = function() {
        popup.classList.remove('show');
        dropZones.forEach(zone => zone.classList.remove('correct-placed'));

        items.forEach(item => {
          item.classList.remove('placed');
          item.style.left = item.getAttribute('data-start-left');
          item.style.top = item.getAttribute('data-start-top');
          item.style.width = item.getAttribute('data-start-width');
          item.style.height = item.getAttribute('data-start-height');
        });
      };
    });

    document.addEventListener('DOMContentLoaded', () => {
  const slide10 = document.getElementById('slide-10');
  if (!slide10) return;

  let currentStep = 0;
  const stepImages = slide10.querySelectorAll('.step-img');
  const totalSteps = stepImages.length;

  slide10.addEventListener('click', (e) => {
    // Ігноруємо кліки по стрілках Swiper
    if (e.target.closest('.swiper-button-next, .swiper-button-prev')) return;

    if (currentStep < totalSteps) {
      currentStep++;
      const nextImg = slide10.querySelector(`.step-img[data-step="${currentStep}"]`);
      if (nextImg) {
        nextImg.classList.add('visible');
      }
    }
  });

  // Скидання при поверненні на слайд
  if (typeof swiper !== 'undefined') {
    swiper.on('slideChange', () => {
      if (swiper.slides[swiper.activeIndex] !== slide10) {
        currentStep = 0;
        stepImages.forEach(img => img.classList.remove('visible'));
      }
    });
  }
});
  </script>
